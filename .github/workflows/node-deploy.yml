name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # 1. Trigger: Wake up when code saves to main

jobs:
  build-and-test:
    runs-on: ubuntu-latest # The cloud computer the robot uses
    
    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Run Tests
      run: npm test --if-present

    - name: Build Docker Image
      run: docker build -t my-node-app:latest .